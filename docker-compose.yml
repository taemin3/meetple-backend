services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: meetple-postgres:16-3.4-bigm
    container_name: meetple-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-1024MB}
      - -c
      - shared_preload_libraries=pg_bigm,pg_stat_statements
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetple}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - meetple-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:-meetple}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: meetple-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_PUSH_TOPIC_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - meetple-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: meetple-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_PUSH_TOPIC_PARTITIONS: ${KAFKA_PUSH_TOPIC_PARTITIONS:-3}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic meetple.push.notification.v1 \
          --partitions "$${KAFKA_PUSH_TOPIC_PARTITIONS}" \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic meetple.push.chat.v1 \
          --partitions "$${KAFKA_PUSH_TOPIC_PARTITIONS}" \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic meetple.image.delete.v1 \
          --partitions "$${KAFKA_PUSH_TOPIC_PARTITIONS}" \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic meetple.email.delivery.v1 \
          --partitions "$${KAFKA_PUSH_TOPIC_PARTITIONS}" \
          --replication-factor 1 \
          --config retention.ms=86400000
        for topic in \
          meetple.push.notification.v1.retry-0 \
          meetple.push.notification.v1.retry-1 \
          meetple.push.notification.v1.retry-2 \
          meetple.push.notification.v1.retry-3 \
          meetple.push.notification.v1.dlq \
          meetple.push.chat.v1.retry-0 \
          meetple.push.chat.v1.retry-1 \
          meetple.push.chat.v1.retry-2 \
          meetple.push.chat.v1.retry-3 \
          meetple.push.chat.v1.dlq \
          meetple.image.delete.v1.retry-0 \
          meetple.image.delete.v1.retry-1 \
          meetple.image.delete.v1.retry-2 \
          meetple.image.delete.v1.retry-3 \
          meetple.image.delete.v1.dlq \
          meetple.email.delivery.v1.retry-0 \
          meetple.email.delivery.v1.retry-1 \
          meetple.email.delivery.v1.retry-2 \
          meetple.email.delivery.v1.dlq
        do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions "$${KAFKA_PUSH_TOPIC_PARTITIONS}" \
            --replication-factor 1
          case "$${topic}" in
            meetple.email.delivery.v1.*)
              /opt/kafka/bin/kafka-configs.sh \
                --bootstrap-server kafka:29092 \
                --entity-type topics \
                --entity-name "$${topic}" \
                --alter \
                --add-config retention.ms=86400000
              ;;
          esac
        done
    restart: "no"

  kafka-connect:
    image: quay.io/debezium/connect:3.6.0.Final
    container_name: meetple-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: meetple-debezium-connect
      CONFIG_STORAGE_TOPIC: meetple.connect.configs
      OFFSET_STORAGE_TOPIC: meetple.connect.offsets
      STATUS_STORAGE_TOPIC: meetple.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_HOST_NAME: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-meetple}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: meetple-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8089}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: meetple-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: meetple-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  redis:
    image: redis:7-alpine
    container_name: meetple-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - meetple-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.4
    container_name: meetple-mailpit
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  meetple-postgres-data:
  meetple-redis-data:
  meetple-kafka-data:
