server:
  forward-headers-strategy: native
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}

auth:
  email-verification:
    from-address: ${EMAIL_FROM_ADDRESS}

naver:
  location:
    search-base-url: ${NAVER_LOCATION_BASE_URL:https://openapi.naver.com}
    search-client-id: ${NAVER_LOCATION_CLIENT_ID}
    search-client-secret: ${NAVER_LOCATION_CLIENT_SECRET}
    maps-base-url: ${NAVER_MAPS_BASE_URL:https://maps.apigw.ntruss.com}
    maps-client-id: ${NAVER_MAPS_CLIENT_ID}
    maps-client-secret: ${NAVER_MAPS_CLIENT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  metrics:
    data:
      repository:
        autotime:
          enabled: false

  observations:
    enable:
      spring:
        security: false
