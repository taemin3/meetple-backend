spring:
  application:
    name: meetple-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PUSH_KAFKA_CONSUMER_GROUP:meetple-push-fcm-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:${PUSH_KAFKA_CONSUMER_CONCURRENCY:3}}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db,redis"

push:
  kafka:
    consumer-enabled: ${PUSH_KAFKA_CONSUMER_ENABLED:false}
    retry:
      initial-delay-ms: ${PUSH_KAFKA_RETRY_INITIAL_DELAY_MS:1000}
      multiplier: ${PUSH_KAFKA_RETRY_MULTIPLIER:10.0}
      max-delay-ms: ${PUSH_KAFKA_RETRY_MAX_DELAY_MS:300000}
  fcm:
    enabled: ${PUSH_FCM_ENABLED:false}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

auth:
  email-delivery:
    kafka:
      consumer-enabled: ${EMAIL_DELIVERY_KAFKA_CONSUMER_ENABLED:true}
      retry:
        initial-delay-ms: ${EMAIL_DELIVERY_KAFKA_RETRY_INITIAL_DELAY_MS:5000}
        multiplier: ${EMAIL_DELIVERY_KAFKA_RETRY_MULTIPLIER:6.0}
        max-delay-ms: ${EMAIL_DELIVERY_KAFKA_RETRY_MAX_DELAY_MS:120000}
  email-verification:
    code-ttl: ${EMAIL_VERIFICATION_CODE_TTL:5m}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:1m}
    signup-token-ttl: ${EMAIL_VERIFICATION_SIGNUP_TOKEN_TTL:15m}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    requester-rate-limit-window: ${EMAIL_VERIFICATION_REQUESTER_RATE_LIMIT_WINDOW:1m}
    requester-rate-limit: ${EMAIL_VERIFICATION_REQUESTER_RATE_LIMIT:5}
    global-rate-limit-window: ${EMAIL_VERIFICATION_GLOBAL_RATE_LIMIT_WINDOW:1m}
    global-rate-limit: ${EMAIL_VERIFICATION_GLOBAL_RATE_LIMIT:100}
    confirmation-requester-rate-limit-window: ${EMAIL_VERIFICATION_CONFIRMATION_REQUESTER_RATE_LIMIT_WINDOW:1m}
    confirmation-requester-rate-limit: ${EMAIL_VERIFICATION_CONFIRMATION_REQUESTER_RATE_LIMIT:10}
    hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET:${JWT_SECRET}}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@meetple.local}
  password-reset:
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:15m}

naver:
  location:
    search-base-url: ${NAVER_LOCATION_BASE_URL:https://openapi.naver.com}
    search-client-id: ${NAVER_LOCATION_CLIENT_ID:}
    search-client-secret: ${NAVER_LOCATION_CLIENT_SECRET:}
    maps-base-url: ${NAVER_MAPS_BASE_URL:https://maps.apigw.ntruss.com}
    maps-client-id: ${NAVER_MAPS_CLIENT_ID:}
    maps-client-secret: ${NAVER_MAPS_CLIENT_SECRET:}

image:
  deletion:
    kafka:
      consumer-enabled: ${IMAGE_DELETION_KAFKA_CONSUMER_ENABLED:${PUSH_KAFKA_CONSUMER_ENABLED:false}}
      retry:
        initial-delay-ms: ${IMAGE_DELETION_KAFKA_RETRY_INITIAL_DELAY_MS:60000}
        multiplier: ${IMAGE_DELETION_KAFKA_RETRY_MULTIPLIER:5.0}
        max-delay-ms: ${IMAGE_DELETION_KAFKA_RETRY_MAX_DELAY_MS:3600000}
  storage:
    bucket: ${IMAGE_STORAGE_BUCKET:}
    region: ${IMAGE_STORAGE_REGION:ap-northeast-2}
    endpoint: ${IMAGE_STORAGE_ENDPOINT:}
    public-base-url: ${IMAGE_STORAGE_PUBLIC_BASE_URL:}
    cloud-front-distribution-id: ${IMAGE_STORAGE_CLOUDFRONT_DISTRIBUTION_ID:}
    access-key: ${IMAGE_STORAGE_ACCESS_KEY:}
    secret-key: ${IMAGE_STORAGE_SECRET_KEY:}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    upload-url-expiration: ${IMAGE_STORAGE_UPLOAD_URL_EXPIRATION:5m}
    max-size-bytes: ${IMAGE_STORAGE_MAX_SIZE_BYTES:5242880}
    path-style-access-enabled: ${IMAGE_STORAGE_PATH_STYLE_ACCESS_ENABLED:false}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
