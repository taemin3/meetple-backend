spring:
  application:
    name: meetple-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PUSH_KAFKA_CONSUMER_GROUP:meetple-push-fcm-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: ${PUSH_KAFKA_CONSUMER_CONCURRENCY:3}
      auto-startup: ${PUSH_KAFKA_CONSUMER_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

push:
  kafka:
    consumer-enabled: ${PUSH_KAFKA_CONSUMER_ENABLED:false}
    retry:
      initial-delay-ms: ${PUSH_KAFKA_RETRY_INITIAL_DELAY_MS:1000}
      multiplier: ${PUSH_KAFKA_RETRY_MULTIPLIER:10.0}
      max-delay-ms: ${PUSH_KAFKA_RETRY_MAX_DELAY_MS:300000}
  fcm:
    enabled: ${PUSH_FCM_ENABLED:false}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

naver:
  location:
    search-base-url: ${NAVER_LOCATION_BASE_URL:https://openapi.naver.com}
    search-client-id: ${NAVER_LOCATION_CLIENT_ID:}
    search-client-secret: ${NAVER_LOCATION_CLIENT_SECRET:}
    maps-base-url: ${NAVER_MAPS_BASE_URL:https://maps.apigw.ntruss.com}
    maps-client-id: ${NAVER_MAPS_CLIENT_ID:}
    maps-client-secret: ${NAVER_MAPS_CLIENT_SECRET:}

image:
  storage:
    bucket: ${IMAGE_STORAGE_BUCKET:}
    region: ${IMAGE_STORAGE_REGION:ap-northeast-2}
    endpoint: ${IMAGE_STORAGE_ENDPOINT:}
    public-base-url: ${IMAGE_STORAGE_PUBLIC_BASE_URL:}
    access-key: ${IMAGE_STORAGE_ACCESS_KEY:}
    secret-key: ${IMAGE_STORAGE_SECRET_KEY:}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    upload-url-expiration: ${IMAGE_STORAGE_UPLOAD_URL_EXPIRATION:5m}
    max-size-bytes: ${IMAGE_STORAGE_MAX_SIZE_BYTES:5242880}
    path-style-access-enabled: ${IMAGE_STORAGE_PATH_STYLE_ACCESS_ENABLED:false}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
