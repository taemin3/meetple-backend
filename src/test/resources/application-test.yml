spring:
  datasource:
    url: jdbc:h2:mem:meetple;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    listener:
      auto-startup: false

push:
  kafka:
    consumer-enabled: false
  fcm:
    enabled: false

auth:
  email-delivery:
    kafka:
      consumer-enabled: false

jwt:
  secret: test-jwt-secret-key-for-meetple-backend-1234567890
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

chat:
  session-invalidation:
    redis-enabled: false
  message-fan-out:
    redis-enabled: false

image:
  deletion:
    kafka:
      consumer-enabled: false
  storage:
    public-base-url: https://cdn.meetple.com
